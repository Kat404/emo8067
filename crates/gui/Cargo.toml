[package]
name = "emo8067-gui"
description = "The windowed debugger: the GUI that draws the debugger's panel model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
emo8067-asm = { path = "../asm" }
emo8067-core = { path = "../core" }
emo8067-debug = { path = "../debug" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "wgpu", "x11"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std", "tracing-log"] }

[dev-dependencies]
log = "0.4.35"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[[bin]]
name = "emo8067-gui"
path = "src/main.rs"
