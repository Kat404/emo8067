[package]
name = "emo8067-gui"
description = "The windowed debugger: the GUI that draws the debugger's panel model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
emo8067-asm = { path = "../asm" }
emo8067-core = { path = "../core" }
emo8067-debug = { path = "../debug" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }

[[bin]]
name = "emo8067-gui"
path = "src/main.rs"
